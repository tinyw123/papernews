# Add, remove, or reorder sources here.
# kind = "hn"  -> Hacker News via Algolia search (top by points in a window)
# kind = "rss" -> RSS/Atom feed via feedparser
#
# Order matters: sources appear in this order in the PDF contents and
# article sequence. Quality first, social last.

# World news (Wikipedia Current events) is rendered inline on page 1 from
# decorations — NOT configured here as a regular article source.

# UK digest, curated for: no tabloid/celebrity content, no paywalled
# feeds (trafilatura can only extract what's actually public), and a mix
# of outlets rather than one newsroom's house view.
#
#   BBC      — public-service remit to impartiality; the closest thing to
#              a "balanced" default UK source. Used for every topic below.
#   Guardian — quality long-form/investigative journalism; editorially
#              left-of-centre. Included for depth; drop it if you want a
#              stricter centre line, or add a right-of-centre outlet
#              alongside it (most — Telegraph, Times — are paywalled and
#              won't extract cleanly here; see the README note on this).
#
# Reuters is deliberately not here — they shut down public RSS in 2020.
# Sky News was tried and dropped: the feeds parse fine but every article
# page came back "no readable content" from trafilatura (0/9 extracted in
# testing) — likely bot-blocking or a JS-rendered page with nothing in the
# server-rendered HTML. Left commented out below in case Sky fixes this or
# someone wants to debug it further.
#
# Limits below total ~41 articles/issue (README's suggested 30-60 sweet
# spot). Raise/lower per source to taste.

# --- Politics --------------------------------------------------------------

[[source]]
name = "BBC Politics"
kind = "rss"
url = "https://feeds.bbci.co.uk/news/politics/rss.xml"
limit = 6

[[source]]
name = "Guardian Politics"
kind = "rss"
url = "https://www.theguardian.com/politics/rss"
limit = 4

# --- Business --------------------------------------------------------------

[[source]]
name = "BBC Business"
kind = "rss"
url = "https://feeds.bbci.co.uk/news/business/rss.xml"
limit = 5

[[source]]
name = "Guardian Business"
kind = "rss"
url = "https://www.theguardian.com/uk/business/rss"
limit = 3

# --- Sport -------------------------------------------------------------

[[source]]
name = "BBC Sport"
kind = "rss"
url = "https://feeds.bbci.co.uk/sport/rss.xml"
limit = 6

[[source]]
name = "Guardian Sport"
kind = "rss"
url = "https://www.theguardian.com/uk/sport/rss"
limit = 4

# --- Technology --------------------------------------------------------

[[source]]
name = "BBC Technology"
kind = "rss"
url = "https://feeds.bbci.co.uk/news/technology/rss.xml"
limit = 5

[[source]]
name = "Guardian Technology"
kind = "rss"
url = "https://www.theguardian.com/uk/technology/rss"
limit = 3

# --- UK general (catches stories outside the four topics above) ------------

[[source]]
name = "BBC UK News"
kind = "rss"
url = "https://feeds.bbci.co.uk/news/uk/rss.xml"
limit = 5
since_hours = 24

